# Authenticated argos-server connected to a real Zenoh fleet.
# The GPUI dashboard runs on the host (`cargo run -p argos-gpui`); this image has no web bundle.
# docker compose --env-file .env.fleet -f compose.fleet.yaml up -d --build
name: argos-fleet
services:
  argos:
    build:
      context: .
      dockerfile: packaging/web/Dockerfile
    environment:
      ARGOS_ENV: production
      ARGOS_DEV_AUTH: "false"
      ARGOS_FLEET: zenoh
      ARGOS_BIND: 0.0.0.0:8080
      ARGOS_ORIGIN: https://localhost:8443
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Set GITHUB_CLIENT_ID in .env.fleet}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?Set GITHUB_CLIENT_SECRET in .env.fleet}
      ARGOS_OPERATORS: ${ARGOS_OPERATORS:?Set numeric GitHub operator IDs in .env.fleet}
      ARGOS_VIEWERS: ${ARGOS_VIEWERS:-}
      ARGOS_ZENOH_ENDPOINT: ${ARGOS_ZENOH_ENDPOINT:?Set the fleet router endpoint in .env.fleet}
      ARGOS_ZENOH_PREFIX: ${ARGOS_ZENOH_PREFIX:-terra/phone}
      # Pass through only when supplied; omit both variables for an unauthenticated router.
      ARGOS_ZENOH_USER:
      ARGOS_ZENOH_PASSWORD:
      ARGOS_TILE_STYLE: ${ARGOS_TILE_STYLE:-}
      RUST_LOG: ${RUST_LOG:-argos_server=info,tower_http=info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - argos-fleet-data:/data
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
  proxy:
    image: caddy:2
    depends_on:
      - argos
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./packaging/web/Caddyfile.fleet:/etc/caddy/Caddyfile:ro
      - caddy-fleet-data:/data
      - caddy-fleet-config:/config
    restart: unless-stopped
volumes:
  argos-fleet-data:
  caddy-fleet-data:
  caddy-fleet-config:
