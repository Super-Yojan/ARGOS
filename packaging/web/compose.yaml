# Linux production host. Tailscale runs on the host; only Caddy exposes public ports.
services:
  argos:
    build:
      context: ../..
      dockerfile: packaging/web/Dockerfile
    env_file: .env
    environment:
      ARGOS_ENV: production
      ARGOS_DEV_AUTH: "false"
      ARGOS_BIND: 127.0.0.1:8080
    network_mode: host
    volumes:
      - argos-data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
  caddy:
    image: caddy:2
    env_file: .env
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
volumes:
  argos-data:
  caddy-data:
  caddy-config:
