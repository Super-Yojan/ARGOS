# Local-only development router. Run the GPUI dashboard on the host.
# Production TLS and authentication are configured in packaging/gcp/.
services:
  router:
    build:
      context: .
      dockerfile: packaging/router/Dockerfile
    command: ["--port", "7448", "--bind", "0.0.0.0"]
    ports:
      - "127.0.0.1:7448:7448"
    init: true
    restart: unless-stopped
