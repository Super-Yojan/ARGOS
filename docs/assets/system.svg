<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="sysTitle sysDesc">
  <title id="sysTitle">ARGOS, Terra, TerraPhone, and Zorvane</title>
  <desc id="sysDesc">The operator uses ARGOS. ARGOS publishes on Zenoh prefix terra/rover. That bus reaches Terra vehicles and the Zorvane simulator. TerraPhone is the iOS app on the Terra vehicle.</desc>
  <style>
    text { font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    a:hover .card { filter: brightness(1.12); }
    a:focus .card { stroke: #ffeb3b; stroke-width: 3; }
  </style>
  <rect width="1000" height="560" rx="16" fill="#f4f7f8"/>
  <text x="36" y="40" fill="#546e7a" font-size="14">Click a box to open its docs</text>

