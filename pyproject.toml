[project]
name = "argos"
version = "0.1.0"
description = "ARGOS fleet supervision for Terra rovers over Zenoh"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["eclipse-zenoh>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
argos = "argos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argos"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
