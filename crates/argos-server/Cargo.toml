[package]
name = "argos-server"
version.workspace = true
edition.workspace = true

[dependencies]
argos-core = { path = "../argos-core" }
argos-zenoh = { path = "../argos-zenoh" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
axum = "0.8"
async-stream = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }

[dev-dependencies]
zenoh.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
