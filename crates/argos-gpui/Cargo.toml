[package]
name = "argos-gpui"
version.workspace = true
edition.workspace = true
description = "ARGOS operator dashboard. Map View with Zenoh goals, autonomy, and teleop."

[lib]
name = "argos_gpui"
path = "src/lib.rs"

[[bin]]
name = "argos-gpui"
path = "src/main.rs"

[dependencies]
argos-core = { path = "../argos-core" }
argos-zenoh = { path = "../argos-zenoh" }
serde_json.workspace = true
fpv-signaling.workspace = true
zenoh.workspace = true
dotenvy = "0.15"
terra-map = { path = "../terra-map" }
gpui-kit = "=0.8.0"
webrtc.workspace = true
openh264.workspace = true
tokio.workspace = true
bytes.workspace = true
uuid.workspace = true
image.workspace = true
smallvec.workspace = true

[[bin]]
name = "fpv-test-sender"
path = "src/bin/fpv_test_sender.rs"

[[test]]
name = "fleet_feed"
path = "../../tests/argos-gpui/fleet_feed.rs"

[[test]]
name = "agent_bridge"
path = "../../tests/argos-gpui/agent_bridge.rs"
