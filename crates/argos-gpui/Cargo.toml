[package]
name = "argos-gpui"
version.workspace = true
edition.workspace = true
description = "ARGOS operator dashboard. Map View with a read-only Zenoh fleet."

[lib]
name = "argos_gpui"
path = "src/lib.rs"

[[bin]]
name = "argos-gpui"
path = "src/main.rs"

[dependencies]
argos-core = { path = "../argos-core" }
argos-zenoh = { path = "../argos-zenoh" }
serde_json.workspace = true
terra-map = { path = "../terra-map" }
gpui-kit = "=0.8.0"

[dev-dependencies]
zenoh.workspace = true
